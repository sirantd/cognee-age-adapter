[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognee-age-adapter"
version = "0.1.0"
description = "A provenance-complete Apache AGE graph adapter for cognee"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
  # psycopg 3 binds the one agtype parameter map of cypher() as a server-side
  # parameter ($1). AGE requires the third argument of cypher() to be a
  # parameter, so the client-side binding of psycopg 2 cannot work here.
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
]

[project.optional-dependencies]
# cognee is a peer, not a runtime dependency: the adapter is installed INTO a
# cognee image that already provides it. Pinned exactly for tests because the
# contract suite is the only drift detector for the graph interface.
#
# 📌 1.6.10 is the version of the next homelab cognee image (2026-11-19). From
# 1.6.8, the contract suite and databases/unified/ have no diff, and
# graph_db_interface.py changed in its docstrings only. In databases/graph/,
# only the pool defaults of postgres_demo changed. add_data_points now writes
# the node vectors while it writes the edge rows of the graph.
test = [
  "cognee==1.6.10",
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cognee_age_adapter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: needs a live PostgreSQL with Apache AGE (AGE_HOST / AGE_PORT)",
  "production_copy: needs a production-size copy of the graph (AGE_COPY_GRAPH)",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["tests"]
